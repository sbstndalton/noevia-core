# sandbox-bridge.wasm (#999): the Rust/WebAssembly port of the code sandbox bridge's untrusted-input
# handling (pi-acp-bridge.cjs lines/toolCallFor, supervisor.cjs start line and insideRoot's decision).
# Built from sbstndalton/noevia-rs at NOEVIA_RS_REF (tarball checksum NOEVIA_RS_SHA256) with
# tools/build-sandbox-bridge-wasm.sh, reproducible on Linux x86_64 (CI and the image build); the
# module's bytes must hash to SANDBOX_BRIDGE_WASM_SHA256 or the code-sandbox image build fails and
