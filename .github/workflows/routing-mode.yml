name: Native routing configuration ownership
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  routing-mode:
    name: Required routing configuration ownership and state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROUTING_CORE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - run: npm ci --no-fund --no-audit
        working-directory: server
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path tools/qualification/routing-acceptance/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path tools/qualification/routing-acceptance/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --locked --manifest-path tools/qualification/routing-acceptance/Cargo.toml
      - name: Actual candidate factory, bounded feature truth and persisted failure states
        run: tools/qualification/routing-acceptance/target/debug/routing-acceptance "$PWD" mutants > "$RUNNER_TEMP/routing-ownership.log"
      - name: Wrong source must refuse before executing Node
        run: |
          set -euo pipefail
          if ROUTING_CORE_HEAD=0000000000000000000000000000000000000000 tools/qualification/routing-acceptance/target/debug/routing-acceptance "$PWD" > "$RUNNER_TEMP/routing-wrong-source.log" 2>&1; then exit 1; fi
          grep -q 'candidate HEAD does not match workflow input' "$RUNNER_TEMP/routing-wrong-source.log"
          test -z "$(git status --porcelain --untracked-files=no)"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: routing-configuration-ownership
          path: |
            ${{ runner.temp }}/routing-ownership.log
            ${{ runner.temp }}/routing-wrong-source.log
          if-no-files-found: error
