name: Native sampling settings front contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sampling-front:
    name: Required native sampling settings front contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: core
      # Immutable M6 acceptance input (rs #70), not a release pin.
      # Independently downloaded twice; byte-identical archive hash.
      - name: Fetch verified native sampling settings acceptance source
        run: |
          set -euo pipefail
          curl -fsSL https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/79b4f3c62be8336d7e73591d6746ce85f23b9e10 -o "$RUNNER_TEMP/sampling-rs.tgz"
          echo "a760fc5c6ab8ec754c71f354ae4aebc378d185486c6fba78c4b4350647748236  $RUNNER_TEMP/sampling-rs.tgz" | sha256sum -c -
          mkdir rs
          tar -xzf "$RUNNER_TEMP/sampling-rs.tgz" --strip-components=1 -C rs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - name: Build the independently pinned required server WASM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' core/server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          status=$(gh api "repos/sbstndalton/noevia-rs/compare/$NOEVIA_RS_REF...main" --jq .status)
          case "$status" in identical|ahead) ;; *) echo "Required WASM pin is not on main"; exit 1 ;; esac
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/wasm-rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/wasm-rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasm-rs"
          tar -xzf "$RUNNER_TEMP/wasm-rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/wasm-rs"
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          "$RUNNER_TEMP/wasm-rs/tools/build-dav-parse-wasm.sh" "$GITHUB_WORKSPACE/core/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  core/server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: Actual Node oracle and bounded native HTTP contracts
        working-directory: rs
        run: |
          set -euo pipefail
          node --test ../core/server/routes/sampling-settings.test.cjs ../core/server/rust-auth.test.cjs ../core/server/contract-corpus-sampling-env.test.cjs
          node tools/gen-sampling-fixtures.cjs ../core "$RUNNER_TEMP/node-sampling.json"
          NOEVIA_SAMPLING_FIXTURE="$RUNNER_TEMP/node-sampling.json" NOEVIA_SAMPLING_CORE_SHA="$(git -C ../core rev-parse HEAD)" cargo test --locked -p server-sampling-settings
          cargo test --locked -p noevia-server --test sampling_settings
          cargo test --locked -p noevia-server --lib sampling_
          cargo build --locked -p replay -p noevia-server
      - name: Full HTTP corpus through native auth and sampling settings
        working-directory: rs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/sampling-positive" \
            --server-cmd "exec env NOEVIA_RUST_AUTH=1 NOEVIA_RUST_SAMPLING_SETTINGS=1 sh '$GITHUB_WORKSPACE/rs/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/rs/target/debug/noevia-server'" \
            --report "$RUNNER_TEMP/sampling-positive.json"
      - name: Sampling omission refuses Node fallback with functional native identity
        working-directory: rs
        run: |
          set -uo pipefail
          if target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/sampling-control" \
            --server-cmd "exec env NOEVIA_RUST_AUTH=1 NOEVIA_RUST_SAMPLING_SETTINGS=1 REPLAY_FRONT_CONTROL_NODE_ONLY_SAMPLING_SETTINGS=1 sh '$GITHUB_WORKSPACE/rs/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/rs/target/debug/noevia-server'" \
            --report "$RUNNER_TEMP/sampling-control.json"; then
            echo "::error::missing native sampling handler replayed successfully"; exit 1
          fi
          python3 - "$RUNNER_TEMP/sampling-control.json" <<'PYCONTROL'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          sampling=[r for r in rows if r['method']=='GET' and r['path']=='/api/sampling-settings' and r['expectedStatus']==200]
          sessions=[r for r in rows if r['method']=='GET' and r['path']=='/api/auth/session' and r['expectedStatus']==200]
          setup=[r for r in rows if r['path']=='/api/setup/complete' and r['expectedStatus']==201]
          assert sampling and all(r['status']==503 for r in sampling), sampling
          assert sessions and all(r['status']==200 for r in sessions), sessions
          assert setup and all(r['status']==201 for r in setup), setup
          print('specific sampling 503 controls:',len(sampling),'native identity 200:',len(sessions),'native setup 201:',len(setup))
          PYCONTROL
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-sampling-front-evidence
          path: |
            ${{ runner.temp }}/sampling-positive.json
            ${{ runner.temp }}/sampling-control.json
            ${{ runner.temp }}/node-sampling.json
          if-no-files-found: error
