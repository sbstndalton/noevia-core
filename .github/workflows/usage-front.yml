name: Native usage front contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  usage-front:
    name: Required native usage front contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # sbstndalton/noevia#1071: Node no longer has /api/usage; the Rust front owns it permanently. The
      # Node oracle is pinned at the last core main that had the handler (a11598b), never this
      # candidate, so the native contracts keep their recorded oracle.
      ORACLE_CORE: a11598b7dcfbc8b716639f1ad5dbb9d1d81bd010
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.ORACLE_CORE }}
          path: oracle-core
      # The native source: the noevia-rs#112 merge commit (core#126 corpus, #1806), not a runtime
      # release pin. Independently downloaded twice; byte-identical archive hash.
      - name: Fetch verified native source
        run: |
          set -euo pipefail
          curl -fsSL https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/fa8661143c9b3b55f5e7d111ff458254424ddb42 -o "$RUNNER_TEMP/native-rs.tgz"
          echo "9d011cb54e46479b729723a9482e79131d87ed2df0092728b41b3f33112716a6  $RUNNER_TEMP/native-rs.tgz" | sha256sum -c -
          mkdir rs
          tar -xzf "$RUNNER_TEMP/native-rs.tgz" --strip-components=1 -C rs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - run: npm ci --no-fund --no-audit
        working-directory: oracle-core/server
      - name: The candidate core refuses the route whatever the environment says
        working-directory: core/server
        run: node --test routes/front-owned-routes.test.cjs
      - name: Native reporting contracts against the pinned Node oracle
        working-directory: rs
        run: |
          set -euo pipefail
          node tools/gen-usage-fixtures.cjs ../oracle-core "$RUNNER_TEMP/node-usage.json"
          NOEVIA_USAGE_FIXTURE="$RUNNER_TEMP/node-usage.json" NOEVIA_USAGE_CORE_SHA="$ORACLE_CORE" cargo test --locked -p server-usage
          cargo test --locked -p noevia-server --test usage
          cargo test --locked -p noevia-server --lib usage_
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-usage-front-evidence
          path: ${{ runner.temp }}/node-usage.json
          if-no-files-found: error
