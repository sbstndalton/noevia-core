name: Native usage front contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  usage-front:
    name: Required native usage front contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: core
      # Immutable M6 acceptance input (rs #67), not a release pin.
      # Independently downloaded twice; byte-identical archive hash.
      - name: Fetch verified native usage acceptance source
        run: |
          set -euo pipefail
          curl -fsSL https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/54365851e2645de84ba0681a4391ef1673c824eb -o "$RUNNER_TEMP/usage-rs.tgz"
          echo "171402c6868a400469e97ca83aade73ca979ea262d6ea590eb1f0c5c7ec84e54  $RUNNER_TEMP/usage-rs.tgz" | sha256sum -c -
          mkdir rs
          tar -xzf "$RUNNER_TEMP/usage-rs.tgz" --strip-components=1 -C rs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - name: Build the independently pinned required server WASM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' core/server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          status=$(gh api "repos/sbstndalton/noevia-rs/compare/$NOEVIA_RS_REF...main" --jq .status)
          case "$status" in identical|ahead) ;; *) echo "Required WASM pin is not on main"; exit 1 ;; esac
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/wasm-rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/wasm-rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasm-rs"
          tar -xzf "$RUNNER_TEMP/wasm-rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/wasm-rs"
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          "$RUNNER_TEMP/wasm-rs/tools/build-dav-parse-wasm.sh" "$GITHUB_WORKSPACE/core/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  core/server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: Native and Node reporting contracts
        working-directory: rs
        run: |
          set -euo pipefail
          node --test ../core/server/routes/usage.test.cjs
          node --test ../core/server/usage-summary.test.cjs
          node tools/gen-usage-fixtures.cjs ../core "$RUNNER_TEMP/node-usage.json"
          NOEVIA_USAGE_FIXTURE="$RUNNER_TEMP/node-usage.json" NOEVIA_USAGE_CORE_SHA="$(git -C ../core rev-parse HEAD)" cargo test --locked -p server-usage
          cargo test --locked -p noevia-server --test usage
          cargo test --locked -p noevia-server --lib usage_
          cargo build --locked -p replay -p noevia-server
      - name: Full HTTP replay through native auth and usage
        working-directory: rs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/usage-positive" \
            --server-cmd "exec env NOEVIA_RUST_AUTH=1 NOEVIA_RUST_USAGE=1 sh '$GITHUB_WORKSPACE/rs/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/rs/target/debug/noevia-server'" \
            --report "$RUNNER_TEMP/usage-positive.json"
      - name: Usage omission refuses fallback while native auth still works
        working-directory: rs
        run: |
          set -uo pipefail
          if target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/usage-control" \
            --server-cmd "exec env NOEVIA_RUST_AUTH=1 NOEVIA_RUST_USAGE=1 REPLAY_FRONT_CONTROL_NODE_ONLY_USAGE=1 sh '$GITHUB_WORKSPACE/rs/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$GITHUB_WORKSPACE/rs/target/debug/noevia-server'" \
            --report "$RUNNER_TEMP/usage-control.json"; then
            echo "::error::missing native usage replayed successfully"; exit 1
          fi
          python3 - "$RUNNER_TEMP/usage-control.json" <<'PYCONTROL'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          usage=[r for r in rows if r['method']=='GET' and r['path'] in ('/api/usage','/api/usage/aggregate') and r['expectedStatus']==200]
          setup=[r for r in rows if r['path']=='/api/setup/complete' and r['expectedStatus']==201]
          assert usage and all(r['status']==503 for r in usage), usage
          assert setup and all(r['status']==201 for r in setup), setup
          print('specific usage 503 controls:',len(usage),'native setup successes:',len(setup))
          PYCONTROL
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-usage-front-evidence
          path: |
            ${{ runner.temp }}/usage-positive.json
            ${{ runner.temp }}/usage-control.json
            ${{ runner.temp }}/node-usage.json
          if-no-files-found: error
