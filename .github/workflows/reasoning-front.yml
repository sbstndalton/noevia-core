name: Native reasoning default front contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reasoning-front:
    name: Required native reasoning default front contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CORE_ACCEPTANCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: core
      - name: Fetch immutable merged reasoning acceptance source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref=592d94a7dc6373d2adf188547c079d69b47f3d28
          status=$(gh api "repos/sbstndalton/noevia-rs/compare/$ref...main" --jq .status)
          case "$status" in identical|ahead) ;; *) echo 'Acceptance source is not on merged main'; exit 1 ;; esac
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$ref" -o "$RUNNER_TEMP/reasoning-rs.tgz"
          echo "74be654e0f943b7ec43e3ac06099a3c39257f8f772b42636d49ea445eec382bb  $RUNNER_TEMP/reasoning-rs.tgz" | sha256sum -c -
          mkdir rs
          tar -xzf "$RUNNER_TEMP/reasoning-rs.tgz" --strip-components=1 -C rs
          echo "CORE_ACCEPTANCE_RS=$GITHUB_WORKSPACE/rs" >> "$GITHUB_ENV"
          echo "CORE_ACCEPTANCE_ARCHIVE=$RUNNER_TEMP/reasoning-rs.tgz" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - name: Build independently pinned required server WASM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' core/server/dav-parse.lock)"
          status=$(gh api "repos/sbstndalton/noevia-rs/compare/$NOEVIA_RS_REF...main" --jq .status)
          case "$status" in identical|ahead) ;; *) exit 1 ;; esac
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/wasm-rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/wasm-rs.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/wasm-rs"
          tar -xzf "$RUNNER_TEMP/wasm-rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/wasm-rs"
          "$RUNNER_TEMP/wasm-rs/tools/build-dav-parse-wasm.sh" "$PWD/core/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  core/server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: Build explicit candidate adapter and unchanged native tools
        run: |
          set -euo pipefail
          cargo fmt --manifest-path core/tools/qualification/reasoning-acceptance/Cargo.toml --check
          cargo clippy --locked --manifest-path core/tools/qualification/reasoning-acceptance/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --manifest-path core/tools/qualification/reasoning-acceptance/Cargo.toml
          cd rs
          cargo test --locked -p replay calendar
          cargo build --locked -p replay -p noevia-server --features rust-reasoning-settings
          target/debug/noevia-server --features | grep -qx rust-reasoning-settings
      - name: Set up declared acceptance shim and truthful source provenance
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/acceptance-bin" "$RUNNER_TEMP/reasoning-evidence"
          for name in noevia-server replay host-control; do ln -s "$GITHUB_WORKSPACE/rs/target/debug/$name" "$RUNNER_TEMP/acceptance-bin/$name"; done
          ln -s "$GITHUB_WORKSPACE/core/tools/qualification/reasoning-acceptance/target/debug/core-acceptance" "$RUNNER_TEMP/acceptance-bin/core-acceptance"
          printf '%s\n' '#!/bin/sh' '# Explicit candidate-core acceptance seam; original RS launcher is untouched.' 'exec "$(dirname "$0")/core-acceptance" "$@"' > "$RUNNER_TEMP/acceptance-bin/corpus-launcher"
          chmod +x "$RUNNER_TEMP/acceptance-bin/corpus-launcher"
          echo "CORE_ACCEPTANCE_SHIM=$RUNNER_TEMP/acceptance-bin/corpus-launcher" >> "$GITHUB_ENV"
      - name: Actual candidate oracle, seam and source refusal controls
        run: |
          set -euo pipefail
          adapter="$RUNNER_TEMP/acceptance-bin/core-acceptance"
          "$adapter" provenance "$PWD/core" "$RUNNER_TEMP/reasoning-evidence/source.json"
          "$adapter" verify "$PWD/core"
          "$adapter" verify-omission "$PWD/core"
          if CORE_ACCEPTANCE_HEAD=0000000000000000000000000000000000000000 "$adapter" verify "$PWD/core" > "$RUNNER_TEMP/reasoning-evidence/wrong-head.log" 2>&1; then exit 1; fi
          grep -q 'candidate HEAD does not match workflow input' "$RUNNER_TEMP/reasoning-evidence/wrong-head.log"
          template=rs/tools/replay/src/synthetic-host-input.cjs
          cp "$template" "$RUNNER_TEMP/input-original.cjs"
          printf '\n// qualification mutation\n' >> "$template"
          if "$adapter" verify "$PWD/core" > "$RUNNER_TEMP/reasoning-evidence/wrong-template.log" 2>&1; then exit 1; fi
          cp "$RUNNER_TEMP/input-original.cjs" "$template"
          grep -q 'immutable input template checksum mismatch' "$RUNNER_TEMP/reasoning-evidence/wrong-template.log"
          node rs/crates/server-reasoning-settings/tests/oracle.cjs "$PWD/core" "$RUNNER_TEMP/reasoning-evidence/candidate-oracle.json"
          "$adapter" oracle "$PWD/core" "$RUNNER_TEMP/reasoning-evidence/candidate-oracle.json"
          cd rs
          NOEVIA_REASONING_FIXTURE="$RUNNER_TEMP/reasoning-evidence/candidate-oracle.json" NOEVIA_REASONING_CORE_SHA="$CORE_ACCEPTANCE_HEAD" cargo test --locked -p server-reasoning-settings
      - name: Full actual candidate Node/native/state/identity-omission and wrong-host controls
        run: |
          set -euo pipefail
          sh rs/tools/front/reasoning-contracts.sh "$PWD/core" "$RUNNER_TEMP/acceptance-bin/noevia-server" "$RUNNER_TEMP/acceptance-bin/replay" "$RUNNER_TEMP/reasoning-evidence/front"
          "$RUNNER_TEMP/acceptance-bin/host-control" "$PWD/core" "$PWD/rs/contracts/http/corpus" "$RUNNER_TEMP/reasoning-evidence/wrong-host"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-reasoning-candidate-contracts
          path: ${{ runner.temp }}/reasoning-evidence
