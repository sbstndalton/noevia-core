name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws/apps/web
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          # #1290 immutable key-only acceptance input; not a release pin.
          # Twice-fetched archive SHA256 d969984ab011b3ed45279f7d21e3a2925ad2f4fb663a3e88cb3db294c549451c.
          ref: 8937698739754e7c6cee8067b885c5a3be4f2802
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          # Immutable native-fixture guard companion; not a release pin.
          ref: adacbea40d2c0181ea9074026bfb6de34db55027
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          path: sib/noevia-services
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-core
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ws/apps/web/package-lock.json
            ws/apps/web/server/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm ci --no-fund --no-audit
        working-directory: ws/apps/web/server
      - run: npm run check:boundaries
      # #967: dav-parse.wasm at the noevia-rs ref pinned in server/dav-parse.lock, checksum-verified
      # (tarball and module), so the differential and DAV_PARSE_IMPL=wasm tests run for real; since
      # #976/#978 the same module carries s3-list-parse and storage-path (S3_PARSE_IMPL,
      # STORAGE_PATH_IMPL, retired in #1071: always Rust, the JS rules moved to tests/server/oracle/), and since #977 upload-sniff (UPLOAD_SNIFF_IMPL), since #979 secret-envelope (SECRET_ENVELOPE_IMPL, retired in #1071: always Rust, the JS code moved to tests/server/oracle/), since #980 mcp-frame (MCP_FRAME_IMPL), since #1002 chat-template-caps and provider-error (CHAT_TEMPLATE_CAPS_IMPL), since #1003 autotune-plan (AUTOTUNE_PLAN_IMPL), since #1012 preset-reload (PRESET_RELOAD_IMPL), since #1004 load-verdict (DECISION_LOAD_ADVISOR, once LAYA_LOAD_ADVISOR), since #1062 tune-contention (always on, fails closed), since #769/#740 prompt-framing (PROMPT_FRAMING_IMPL), s3-sign (S3_SIGN_IMPL). The shared fixture tables must be byte-identical to noevia-rs's copies. Since #1079 long-profile (always on, fails closed). Since #795 ssrf-policy (SSRF_IMPL). Since #516/#704 stream-guard (STREAM_GUARD_IMPL). gguf-meta (GGUF_META_IMPL, retired in #1071: always Rust, the JS reader deleted, fixtures frozen) and policy-leaves (POLICY_LEAVES_IMPL). review-verdict (CODE_REVIEW_VERDICT_IMPL) and tool-exchange (TOOL_EXCHANGE_IMPL). mcp-servers (MCP_SERVERS_IMPL) and decision (DECISION_IMPL). code-net-guard (CODE_NET_GUARD_IMPL). role-context (ROLE_CONTEXT_IMPL). completeness-report (COMPLETENESS_REPORT_IMPL). task-lifecycle (TASK_LIFECYCLE_IMPL). code-actions (CODE_ACTIONS_IMPL, retired in #1071: always Rust, the JS classifier deleted, fixtures frozen) and project-file-names (PROJECT_FILE_NAMES_IMPL, retired in #1071: always Rust, the JS resolver deleted, fixtures frozen). provider-egress (PROVIDER_EGRESS_IMPL, retired in #1071: always Rust, the JS rules deleted, fixtures frozen). browser-policy (BROWSER_POLICY_IMPL, retired in #1071: always Rust, the JS rules deleted, fixtures frozen). tool-gate (TOOL_GATE_IMPL, retired in #1071: always Rust, the JS rules deleted, fixtures frozen) and toolboxes-permitted (TOOLBOXES_PERMITTED_IMPL, retired in #1071: always Rust, the JS rules deleted, fixtures frozen). llamacpp-presets (LLAMACPP_PRESETS_IMPL). llamacpp-autoconfig (LLAMACPP_AUTOCONFIG_IMPL).
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build dav-parse.wasm at the pinned noevia-rs ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::dav-parse.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          # The pin must be on noevia-rs main (as noevia CI requires of every release pin), so core
          # main never holds a ref from an unmerged or force-pushed-away PR head.
          status=""
          for attempt in 1 2 3 4 5; do
            status=$(gh api "repos/sbstndalton/noevia-rs/compare/$NOEVIA_RS_REF...main" --jq .status 2>/dev/null) && break
            sleep $((attempt * 5))
          done
          echo "dav-parse NOEVIA_RS_REF $NOEVIA_RS_REF: noevia-rs main is '$status'"
          case "$status" in identical|ahead) ;; *) echo "::error::dav-parse.lock NOEVIA_RS_REF is not reachable from sbstndalton/noevia-rs main ('$status')"; exit 1 ;; esac
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs"
          cmp "$RUNNER_TEMP/rs/crates/dav-parse/tests/fixtures/dav-listing.v1.json" tests/fixtures/dav-listing.v1.json
          cmp "$RUNNER_TEMP/rs/crates/s3-list-parse/tests/fixtures/s3-list.v1.json" tests/fixtures/s3-list.v1.json
          cmp "$RUNNER_TEMP/rs/crates/storage-path/tests/fixtures/storage-path.v1.json" tests/fixtures/storage-path.v1.json
          cmp "$RUNNER_TEMP/rs/crates/upload-sniff/tests/fixtures/upload-sniff.v1.json" tests/fixtures/upload-sniff.v1.json
          cmp "$RUNNER_TEMP/rs/crates/secret-envelope/tests/fixtures/secret-envelope.v1.json" tests/fixtures/secret-envelope.v1.json
          cmp "$RUNNER_TEMP/rs/crates/mcp-frame/tests/fixtures/mcp-frame.v1.json" tests/fixtures/mcp-frame.v1.json
          cmp "$RUNNER_TEMP/rs/crates/chat-template-caps/tests/fixtures/chat-template-caps.v1.json" tests/fixtures/chat-template-caps.v1.json
          cmp "$RUNNER_TEMP/rs/crates/autotune-plan/tests/fixtures/autotune-plan.v1.json" tests/fixtures/autotune-plan.v1.json
          cmp "$RUNNER_TEMP/rs/crates/load-verdict/tests/fixtures/load-verdict.v1.json" tests/fixtures/load-verdict.v1.json
          cmp "$RUNNER_TEMP/rs/crates/tune-contention/tests/fixtures/tune-contention.v1.json" tests/fixtures/tune-contention.v1.json
          cmp "$RUNNER_TEMP/rs/crates/long-profile/tests/fixtures/long-profile.v1.json" tests/fixtures/long-profile.v1.json
          cmp "$RUNNER_TEMP/rs/crates/prompt-framing/tests/fixtures/prompt-framing.v1.json" tests/fixtures/prompt-framing.v1.json
          cmp "$RUNNER_TEMP/rs/crates/s3-sign/tests/fixtures/s3-sign.v1.json" tests/fixtures/s3-sign.v1.json
          cmp "$RUNNER_TEMP/rs/crates/ssrf-policy/tests/fixtures/ssrf.v1.json" tests/fixtures/ssrf.v1.json
          cmp "$RUNNER_TEMP/rs/crates/stream-guard/tests/fixtures/stream-guard.v1.json" tests/fixtures/stream-guard.v1.json
          cmp "$RUNNER_TEMP/rs/crates/gguf/tests/fixtures/gguf-meta.v1.json" tests/fixtures/gguf-meta.v1.json
          cmp "$RUNNER_TEMP/rs/crates/policy-leaves/tests/fixtures/policy-leaves.v1.json" tests/fixtures/policy-leaves.v1.json
          cmp "$RUNNER_TEMP/rs/crates/review-verdict/tests/fixtures/code-review-verdict.v1.json" tests/fixtures/code-review-verdict.v1.json
          cmp "$RUNNER_TEMP/rs/crates/tool-exchange/tests/fixtures/tool-exchange.v1.json" tests/fixtures/tool-exchange.v1.json
          cmp "$RUNNER_TEMP/rs/crates/mcp-servers/tests/fixtures/mcp-servers.v1.json" tests/fixtures/mcp-servers.v1.json
          cmp "$RUNNER_TEMP/rs/crates/decision/tests/fixtures/decision.v1.json" tests/fixtures/decision.v1.json
          cmp "$RUNNER_TEMP/rs/crates/code-net-guard/tests/fixtures/code-net-guard.v1.json" tests/fixtures/code-net-guard.v1.json
          cmp "$RUNNER_TEMP/rs/crates/role-context/tests/fixtures/role-context.v1.json" tests/fixtures/role-context.v1.json
          cmp "$RUNNER_TEMP/rs/crates/completeness-report/tests/fixtures/completeness-report.v1.json" tests/fixtures/completeness-report.v1.json
          cmp "$RUNNER_TEMP/rs/crates/task-lifecycle/tests/fixtures/task-lifecycle.v1.json" tests/fixtures/task-lifecycle.v1.json
          cmp "$RUNNER_TEMP/rs/crates/code-actions/tests/fixtures/code-actions.v1.json" tests/fixtures/code-actions.v1.json
          cmp "$RUNNER_TEMP/rs/crates/project-file-names/tests/fixtures/project-file-names.v1.json" tests/fixtures/project-file-names.v1.json
          cmp "$RUNNER_TEMP/rs/crates/provider-egress/tests/fixtures/provider-egress.v1.json" tests/fixtures/provider-egress.v1.json
          cmp "$RUNNER_TEMP/rs/crates/browser-policy/tests/fixtures/browser-policy.v1.json" tests/fixtures/browser-policy.v1.json
          cmp "$RUNNER_TEMP/rs/crates/tool-gate/tests/fixtures/tool-gate.v1.json" tests/fixtures/tool-gate.v1.json
          cmp "$RUNNER_TEMP/rs/crates/toolboxes-permitted/tests/fixtures/toolboxes-permitted.v1.json" tests/fixtures/toolboxes-permitted.v1.json
          cmp "$RUNNER_TEMP/rs/crates/llamacpp-presets/tests/fixtures/llamacpp-presets.v1.json" tests/fixtures/llamacpp-presets.v1.json
          cmp "$RUNNER_TEMP/rs/crates/llamacpp-autoconfig/tests/fixtures/llamacpp-autoconfig.v1.json" tests/fixtures/llamacpp-autoconfig.v1.json
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          "$RUNNER_TEMP/rs/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: Check Rust-selected regexp literal compiler artifact
        run: node tools/gen-llamacpp-regexp-literals.cjs --program "$RUNNER_TEMP/rs/crates/llamacpp-autoconfig/src/evaluator_program.rs" --check
      # #205: qualify the actual filesystem helper, not a second JS migration algorithm.
      # Immutable companion source input (rs225), not a release or dav-parse pin.
      - name: Build the reviewed native legacy claim helper
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          helper_ref=93ccb24740c3f05d8f2861d9a356c657ba13851c
          helper_sha256=05abdc23f65d4d7533db235138cc7ed2cb1f89c87d28a5dcf41338796c0cb5c1
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$helper_ref" -o "$RUNNER_TEMP/claim-rs.tgz"
          echo "$helper_sha256  $RUNNER_TEMP/claim-rs.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/claim-rs"
          tar -xzf "$RUNNER_TEMP/claim-rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/claim-rs"
          CARGO_TARGET_DIR="$RUNNER_TEMP/claim-target" cargo build --locked \
            --manifest-path "$RUNNER_TEMP/claim-rs/Cargo.toml" -p noevia-server --bin noevia-server
          helper="$RUNNER_TEMP/claim-target/debug/noevia-server"
          helper_features="$("$helper" --features)"
          grep -qx legacy-root-claim <<<"$helper_features"
          sha256sum "$helper"
          printf 'NOEVIA_LEGACY_CLAIM_BIN=%s\nNOEVIA_LEGACY_CLAIM_REQUIRED=1\n' "$helper" >> "$GITHUB_ENV"
      # Immutable companion test input, not a release/dav-parse pin. Core's
      # control tests require this actual native binary and byte-equal contracts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-rs
          ref: e4c9f1eb5cf3d58fd55cee737bcebeaa223d4fe3
          path: native-egress-rs
          persist-credentials: false
      - name: Build the reviewed native egress control fixture
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          native_source="$GITHUB_WORKSPACE/native-egress-rs"
          expected=e4c9f1eb5cf3d58fd55cee737bcebeaa223d4fe3
          test "$(git -C "$native_source" rev-parse HEAD)" = "$expected"
          cmp "$GITHUB_WORKSPACE/sib/noevia-web/tests/hermetic-network.cjs" tests/hermetic-network.cjs
          cmp "$native_source/contracts/egress-control.v1.schema.json" contracts/egress-control.v1.schema.json
          cmp "$native_source/contracts/egress-control.v1.vectors.json" contracts/egress-control.v1.vectors.json
          CARGO_TARGET_DIR="$RUNNER_TEMP/native-egress-target" cargo build --locked \
            --manifest-path "$native_source/Cargo.toml" -p egress-proxy --bin egress-proxy
          binary="$RUNNER_TEMP/native-egress-target/debug/egress-proxy"
          # This is a static source-capability assertion. The mandatory tests
          # below separately authenticate Ready and scoped revoke/report/Forget.
          "$binary" --capabilities | node -e '
            const assert = require("node:assert/strict");
            const probe = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            assert.equal(probe.version, 1);
            assert.equal(probe.probe, "source-capability");
            assert.equal(probe.nativeControl, true);
            assert.ok(probe.capabilities.includes("noevia-code-egress-control/1"));
            assert.equal(probe.sessionLeaseMs, 15000);
            assert.equal(probe.renewalMs, 5000);
            assert.equal(probe.readiness, "requires-authenticated-ready");'
          digest="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          printf 'NOEVIA_EGRESS_CONTROL_BINARY=%s\nNOEVIA_EGRESS_CONTROL_BINARY_SHA256=%s\nNOEVIA_RS_CONTROL_CONTRACT_DIR=%s\nNOEVIA_HERMETIC_NATIVE_REQUIRED=1\n' \
            "$binary" "$digest" "$native_source/contracts" >> "$GITHUB_ENV"
      - run: npm run test:server
        env:
          DAV_PARSE_WASM_REQUIRED: '1'
      - name: Required isolated code-actions performance qualification
        run: node --test --test-concurrency=1 tests/server/code-actions-performance.qualification.cjs
        env:
          DAV_PARSE_WASM_REQUIRED: '1'
      - run: node --test tools/qualification/guard.test.cjs
        working-directory: self
      # Native verifier identity/cleanup qualification runs only in its dedicated
      # isolated container below. Never run the retired UID-wide verifier on the host.
      # The release build sets STAMP_VERSION (#317); re-run the stamp test with a SHA-shaped value.
      - run: STAMP_VERSION=ci1234567 node --test tests/server/build-version-stamp.test.cjs
      # Dev tooling (moved from noevia at the cutover, #952): no install step, but it imports
      # server/tool-result-reduce.cjs, so it must not drift. Needs ripgrep.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: node --test tools/repo-index/*.test.cjs
      # #1639: the decision-model eval harness (adapter, runner, scorer, request capture through the real callers).
      - run: node --test tools/decision-eval/*.test.cjs
        env:
          # The tool-gate requests are built with the Rust gate (#1071): a step reorder must not silently skip them.
          DAV_PARSE_WASM_REQUIRED: '1'
      # noevia#1866: the chunker comparison harness (generator, arms, span gold, embed/rerank/score against a local fake).
      - run: node --test tools/rag-eval/*.test.cjs
      # noevia#263: the DAV QA matrix script, parsing and reporting, against a local fake DAV server.
      - run: node --test tools/dav-qa/*.test.cjs
      # Full-Rust migration M0: boot the real server on a throwaway synthetic data dir (mock model
      # and Diary, outbound connections refused) with NOEVIA_CONTRACT_RECORD set, drive the web
      # client's paths, and fail if a secret reached the corpus. The corpus is the artifact
      # noevia-rs contracts/http/corpus is refreshed from.
      - name: Record the synthetic HTTP contract corpus
        run: node tools/contract-corpus/generate.cjs --out "$RUNNER_TEMP/contract-corpus"
      # A replay can only be clean if Node agrees with itself: a second run on a new data dir must
      # record the same normalised corpus (the diff shows placeholders, never secret values).
      - name: A second recording is identical
        run: |
          node tools/contract-corpus/generate.cjs --out "$RUNNER_TEMP/contract-corpus-2" > /dev/null
          diff -r "$RUNNER_TEMP/contract-corpus" "$RUNNER_TEMP/contract-corpus-2"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-corpus
          path: ${{ runner.temp }}/contract-corpus

  code-sandbox:
    name: Code sandbox bridge tests
    runs-on: ubuntu-latest
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          path: sib/noevia-services
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-core
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # #999: sandbox-bridge.wasm at the noevia-rs ref pinned in code-sandbox/sandbox-bridge.lock,
      # checksum-verified (tarball and module), so SANDBOX_BRIDGE_IMPL=rust runs for real against
      # the built artifact. The shared fixture table must be byte-identical to noevia-rs's copy.
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build sandbox-bridge.wasm at the pinned noevia-rs ref
        working-directory: self
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|SANDBOX_BRIDGE_WASM_SHA256)=[0-9a-f]+$' code-sandbox/sandbox-bridge.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sandbox-bridge.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          # The pin must be on noevia-rs main, so core main never holds a ref from an unmerged or
          # force-pushed-away PR head.
          status=""
          for attempt in 1 2 3 4 5; do
            status=$(gh api "repos/sbstndalton/noevia-rs/compare/$NOEVIA_RS_REF...main" --jq .status 2>/dev/null) && break
            sleep $((attempt * 5))
          done
          echo "sandbox-bridge NOEVIA_RS_REF $NOEVIA_RS_REF: noevia-rs main is '$status'"
          case "$status" in identical|ahead) ;; *) echo "::error::sandbox-bridge.lock NOEVIA_RS_REF is not reachable from sbstndalton/noevia-rs main ('$status')"; exit 1 ;; esac
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs"
          cmp "$RUNNER_TEMP/rs/crates/sandbox-bridge/tests/fixtures/sandbox-bridge.v1.json" tests/fixtures/sandbox-bridge.v1.json
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          out="$GITHUB_WORKSPACE/ws/services/code-sandbox/wasm/sandbox-bridge.wasm"
          "$RUNNER_TEMP/rs/tools/build-sandbox-bridge-wasm.sh" "$out"
          echo "$SANDBOX_BRIDGE_WASM_SHA256  $out" | sha256sum -c -
      - name: Native verifier reviewed source archive boundary
        working-directory: self
        run: |
          python3 code-sandbox/tests/verify-native-source.test.py
          node --test code-sandbox/tests/native-verifier-assertions.test.cjs code-sandbox/tests/native-verifier-output.test.cjs
          node --test --test-timeout=2000 code-sandbox/tests/native-verifier-cancel.test.cjs
      - name: The fixture table is what the generator makes from the JS references
        working-directory: self
        run: node tools/gen-sandbox-bridge-fixtures.cjs | cmp - tests/fixtures/sandbox-bridge.v1.json
      - run: node --test ws/services/code-sandbox/pi-acp-bridge.test.cjs ws/services/code-sandbox/sandbox-bridge-wasm.test.cjs
        env:
          SANDBOX_BRIDGE_WASM_REQUIRED: '1'
      # The image a release ships: its own build stage rebuilds and checks the module, and the
      # runtime image must load it (sha256 against the lock, no imports, the ABI) and run the
      # framing and toolCallFor through it.
      # The buildx driver image (moby/buildkit) is itself a Docker Hub pull: mirror the daemon too.
      - name: Docker Hub pull-through mirror (daemon)
        run: self/.github/scripts/docker-hub-mirror.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (v3.12.0)
        with:
          # Docker Hub pull-through mirror, docker.io fallback (noevia #1221).
          buildkitd-config: self/.github/buildkitd-mirror.toml
          # The driver image itself is a Docker Hub pull; take it from the mirror (same tag).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: self/code-sandbox
          file: self/code-sandbox/Dockerfile
          build-args: |
            HARNESS_PACKAGE=@earendil-works/pi-coding-agent
            HARNESS_VERSION=0.87.0
          push: false
          load: true
          tags: noevia-code-sandbox:ci
          cache-from: type=gha,scope=code-sandbox
          cache-to: type=gha,mode=max,scope=code-sandbox
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: self/code-sandbox
          file: self/code-sandbox/Dockerfile
          target: native-verifier-fixtures
          push: false
          load: true
          tags: noevia-code-sandbox:verifier-fixtures
          cache-from: type=gha,scope=code-sandbox
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          ref: 06f96d8a1ad023414a513eed3a2ba3358687bea8
          path: native-verifier-profile
      - name: Required native verifier namespace and measured-caller qualification
        working-directory: .
        env:
          NOEVIA_NATIVE_VERIFIER_QUALIFICATION: '1'
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/native-verifier-profile.json"
          docker compose --env-file native-verifier-profile/.env.example --project-directory native-verifier-profile --profile code \
            -f native-verifier-profile/compose.yaml -f native-verifier-profile/deploy/examples/code-sandbox.override.yml \
            config --format json > "$profile"
          node self/code-sandbox/tests/qualify-native-verifier.cjs "$profile" noevia-code-sandbox:ci "$GITHUB_WORKSPACE/self" noevia-code-sandbox:verifier-fixtures
      - name: The shipped image loads sandbox-bridge.wasm
        run: |
          set -euo pipefail
          docker run --rm --read-only noevia-code-sandbox:ci node -e '
            const sb = require("/srv/sandbox-bridge-wasm.cjs");
            sb.ensure();
            const seen = [];
            sb.linesRust((m) => seen.push(m), () => {}, undefined, (e) => { throw e; })("{\"a\":1}\r\nnope\n");
            const call = sb.toolCallForRust({ toolCallId: "c1", toolName: "bash", input: { command: "ls" } });
            if (JSON.stringify(seen) !== "[{\"a\":1}]" || call.kind !== "execute" || call.title !== "ls") process.exit(1);
            console.log("sandbox-bridge.wasm OK in the shipped image");'

  web-image:
    name: Web image build
    runs-on: ubuntu-latest
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          # #2069 immutable image recipe retains preserved differential reference inputs.
          # Twice-fetched archive SHA256 635529d872707a36f99da68555fc637ce190aab8b962685b218b8abccafb759c.
          ref: 11b57701442c5a73debd2b7afef8e208e82b2e1e
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          path: sib/noevia-services
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-core
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      # Since the repo split cutover (noevia #952) the web image is built the way a release builds
      # it: noevia's build/web.Dockerfile over an assembled tree (web/ = noevia-web, core/ =
      # noevia-core, release-refs), as deploy/tools/assemble-release.sh lays it out. The image
      # build runs the client and server tests too.
      - name: Lay out an assembled release tree
        env:
          WEB: sib/noevia-web
          CORE: self
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/tree"; mkdir -p "$t/web" "$t/core" "$t/noevia/build" "$t/rs"
          # noevia #1243: the web image copies noevia/build/web-supervisor.sh and builds the Rust front
          # from rs/ when present (empty here: the CI image carries the Node front only).
          cp ws/build/web-supervisor.sh "$t/noevia/build/web-supervisor.sh"
          git -C "$WEB" archive HEAD | tar -x -C "$t/web"
          git -C "$CORE" archive HEAD | tar -x -C "$t/core"
          printf 'NOEVIA_SHA=%s\nNOEVIA_WEB_SHA=%s\nNOEVIA_CORE_SHA=%s\nNOEVIA_SERVICES_SHA=%s\n' "$(git -C ws rev-parse HEAD)" \
            "$(git -C "$WEB" rev-parse HEAD)" "$(git -C "$CORE" rev-parse HEAD)" ci > "$t/release-refs"
          echo "TREE=$t" >> "$GITHUB_ENV"
      # The buildx driver image (moby/buildkit) is itself a Docker Hub pull: mirror the daemon too.
      - name: Docker Hub pull-through mirror (daemon)
        run: self/.github/scripts/docker-hub-mirror.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (v3.12.0)
        with:
          # Docker Hub pull-through mirror, docker.io fallback (noevia #1221).
          buildkitd-config: self/.github/buildkitd-mirror.toml
          # The driver image itself is a Docker Hub pull; take it from the mirror (same tag).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: ${{ env.TREE }}
          file: ws/build/web.Dockerfile
          push: false
          # load: the next step runs tests inside the built (runtime-stage) image.
          load: true
          tags: noevia-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # noevia #990: the differential tests compare Node's own decoders (TextDecoder windows-1252,
      # base64url) with the Rust module. The image build runs the tests on the alpine build stage;
      # this runs the upload-sniff, secret-envelope (and its #1071 retirement corpus), storage-path (likewise), mcp-frame, s3-sign, stream-guard, gguf-meta, policy-leaves, code-review-verdict, tool-exchange, mcp-servers, decision, code-net-guard, role-context, completeness-report, task-lifecycle, llamacpp-autoconfig, code-actions, project-file-names, provider-egress, browser-policy, tool-gate, toolboxes-permitted and llamacpp-presets (JSON.parse, String#trim and Number() white space, non-Unicode RegExp \s/\b//i, String#normalize NFKD, toLowerCase/toUpperCase,, String#trim, URL, /\s/, Number#toString, utf8 decoding,
      # Object.prototype) ones on the exact runtime image that ships
      # (node:22-bookworm, whatever Node 22.x it resolves to), not on the runner's Node.
      - name: Differential tests on the shipped runtime image
        run: |
          set -euo pipefail
          test -f "$TREE/core/tools/gen-llamacpp-linear-family.cjs"
          docker run --rm -e DAV_PARSE_WASM_REQUIRED=1 \
            -v "$TREE/core/tests:/app/tests:ro" \
            -v "$TREE/core/tools/gen-llamacpp-linear-family.cjs:/app/tools/gen-llamacpp-linear-family.cjs:ro" -w /app noevia-web:ci sh -c \
            'node --version && node --test --test-concurrency=1 tests/server/upload-sniff-differential.test.cjs tests/server/secret-envelope-differential.test.cjs tests/server/secret-envelope-retirement.test.cjs tests/server/storage-wasm-differential.test.cjs tests/server/storage-path-retirement.test.cjs tests/server/mcp-frame-differential.test.cjs tests/server/chat-template-caps-differential.test.cjs tests/server/autotune-plan-differential.test.cjs tests/server/load-verdict-differential.test.cjs tests/server/tune-contention-differential.test.cjs tests/server/long-profile-differential.test.cjs tests/server/s3-sign-differential.test.cjs tests/server/stream-guard-differential.test.cjs tests/server/gguf-meta-differential.test.cjs tests/server/policy-leaves-differential.test.cjs tests/server/code-review-verdict-differential.test.cjs tests/server/tool-exchange-differential.test.cjs tests/server/mcp-servers-differential.test.cjs tests/server/decision-differential.test.cjs tests/server/code-net-guard-differential.test.cjs tests/server/code-net-guard-frozen.test.cjs tests/server/role-context-differential.test.cjs tests/server/completeness-report-differential.test.cjs server/completeness-policy-native.test.cjs server/completeness-report-historical.test.cjs tests/server/task-lifecycle-differential.test.cjs tests/server/code-actions-differential.test.cjs tests/server/project-file-names-differential.test.cjs tests/server/provider-egress-differential.test.cjs tests/server/browser-policy-differential.test.cjs tests/server/tool-gate-differential.test.cjs tests/server/toolboxes-permitted-differential.test.cjs tests/server/llamacpp-presets-differential.test.cjs tests/server/llamacpp-autoconfig-differential.test.cjs tests/server/llamacpp-autoconfig-differential-seeded-a.test.cjs tests/server/llamacpp-autoconfig-differential-seeded-b.test.cjs tests/server/llamacpp-autoconfig-differential-seeded-c.test.cjs tests/server/llamacpp-autoconfig-differential-seeded-d.test.cjs tests/server/llamacpp-autoconfig-regexp-literals.test.cjs server/llamacpp-autoconfig-linear-family.test.cjs server/llamacpp-autoconfig-linear-registers.test.cjs && node --test --test-concurrency=1 tests/server/code-actions-performance.qualification.cjs'
