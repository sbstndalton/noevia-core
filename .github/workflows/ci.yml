name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws/apps/web
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/, the OCR test reading server/pdf-reduce.cjs) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          path: sib/noevia-services
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-core
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ws/apps/web/package-lock.json
            ws/apps/web/server/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm ci --no-fund --no-audit
        working-directory: ws/apps/web/server
      - run: npm run check:boundaries
      # #967: dav-parse.wasm at the noevia-rs ref pinned in server/dav-parse.lock, checksum-verified
      # (tarball and module), so the differential and DAV_PARSE_IMPL=wasm tests run for real; since
      # #976/#978 the same module carries s3-list-parse and storage-path (S3_PARSE_IMPL,
      # STORAGE_PATH_IMPL), and since #977 upload-sniff (UPLOAD_SNIFF_IMPL), since #979 secret-envelope (SECRET_ENVELOPE_IMPL), since #980 mcp-frame (MCP_FRAME_IMPL), since #1002 chat-template-caps and provider-error (CHAT_TEMPLATE_CAPS_IMPL), since #1003 autotune-plan (AUTOTUNE_PLAN_IMPL), since #1012 preset-reload (PRESET_RELOAD_IMPL), since #1004 load-verdict (LAYA_LOAD_ADVISOR), since #1062 tune-contention (always on, fails closed), since #769/#740 prompt-framing (PROMPT_FRAMING_IMPL), s3-sign (S3_SIGN_IMPL). The shared fixture tables must be byte-identical to noevia-rs's copies. Since #1079 long-profile (always on, fails closed). Since #795 ssrf-policy (SSRF_IMPL). Since #516/#704 stream-guard (STREAM_GUARD_IMPL). gguf-meta (GGUF_META_IMPL) and policy-leaves (POLICY_LEAVES_IMPL). review-verdict (CODE_REVIEW_VERDICT_IMPL) and tool-exchange (TOOL_EXCHANGE_IMPL). mcp-servers (MCP_SERVERS_IMPL) and decision (DECISION_IMPL). code-net-guard (CODE_NET_GUARD_IMPL). role-context (ROLE_CONTEXT_IMPL). completeness-report (COMPLETENESS_REPORT_IMPL). task-lifecycle (TASK_LIFECYCLE_IMPL). code-actions (CODE_ACTIONS_IMPL) and project-file-names (PROJECT_FILE_NAMES_IMPL). provider-egress (PROVIDER_EGRESS_IMPL). browser-policy (BROWSER_POLICY_IMPL). tool-gate (TOOL_GATE_IMPL) and toolboxes-permitted (TOOLBOXES_PERMITTED_IMPL). llamacpp-presets (LLAMACPP_PRESETS_IMPL). project-edit-target (PROJECT_EDIT_TARGET_IMPL). llamacpp-autoconfig (LLAMACPP_AUTOCONFIG_IMPL).
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build dav-parse.wasm at the pinned noevia-rs ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::dav-parse.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          # The pin must be on noevia-rs main (as noevia CI requires of every release pin), so core
          # main never holds a ref from an unmerged or force-pushed-away PR head.
          status=""
          for attempt in 1 2 3 4 5; do
            status=$(gh api "repos/sbstndalton/noevia-rs/compare/$NOEVIA_RS_REF...main" --jq .status 2>/dev/null) && break
            sleep $((attempt * 5))
          done
          echo "dav-parse NOEVIA_RS_REF $NOEVIA_RS_REF: noevia-rs main is '$status'"
          case "$status" in identical|ahead) ;; *) echo "::error::dav-parse.lock NOEVIA_RS_REF is not reachable from sbstndalton/noevia-rs main ('$status')"; exit 1 ;; esac
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs"
          cmp "$RUNNER_TEMP/rs/crates/dav-parse/tests/fixtures/dav-listing.v1.json" tests/fixtures/dav-listing.v1.json
          cmp "$RUNNER_TEMP/rs/crates/s3-list-parse/tests/fixtures/s3-list.v1.json" tests/fixtures/s3-list.v1.json
          cmp "$RUNNER_TEMP/rs/crates/storage-path/tests/fixtures/storage-path.v1.json" tests/fixtures/storage-path.v1.json
          cmp "$RUNNER_TEMP/rs/crates/upload-sniff/tests/fixtures/upload-sniff.v1.json" tests/fixtures/upload-sniff.v1.json
          cmp "$RUNNER_TEMP/rs/crates/secret-envelope/tests/fixtures/secret-envelope.v1.json" tests/fixtures/secret-envelope.v1.json
          cmp "$RUNNER_TEMP/rs/crates/mcp-frame/tests/fixtures/mcp-frame.v1.json" tests/fixtures/mcp-frame.v1.json
          cmp "$RUNNER_TEMP/rs/crates/chat-template-caps/tests/fixtures/chat-template-caps.v1.json" tests/fixtures/chat-template-caps.v1.json
          cmp "$RUNNER_TEMP/rs/crates/autotune-plan/tests/fixtures/autotune-plan.v1.json" tests/fixtures/autotune-plan.v1.json
          cmp "$RUNNER_TEMP/rs/crates/load-verdict/tests/fixtures/load-verdict.v1.json" tests/fixtures/load-verdict.v1.json
          cmp "$RUNNER_TEMP/rs/crates/tune-contention/tests/fixtures/tune-contention.v1.json" tests/fixtures/tune-contention.v1.json
          cmp "$RUNNER_TEMP/rs/crates/long-profile/tests/fixtures/long-profile.v1.json" tests/fixtures/long-profile.v1.json
          cmp "$RUNNER_TEMP/rs/crates/prompt-framing/tests/fixtures/prompt-framing.v1.json" tests/fixtures/prompt-framing.v1.json
          cmp "$RUNNER_TEMP/rs/crates/s3-sign/tests/fixtures/s3-sign.v1.json" tests/fixtures/s3-sign.v1.json
          cmp "$RUNNER_TEMP/rs/crates/ssrf-policy/tests/fixtures/ssrf.v1.json" tests/fixtures/ssrf.v1.json
          cmp "$RUNNER_TEMP/rs/crates/stream-guard/tests/fixtures/stream-guard.v1.json" tests/fixtures/stream-guard.v1.json
          cmp "$RUNNER_TEMP/rs/crates/gguf/tests/fixtures/gguf-meta.v1.json" tests/fixtures/gguf-meta.v1.json
          cmp "$RUNNER_TEMP/rs/crates/policy-leaves/tests/fixtures/policy-leaves.v1.json" tests/fixtures/policy-leaves.v1.json
          cmp "$RUNNER_TEMP/rs/crates/review-verdict/tests/fixtures/code-review-verdict.v1.json" tests/fixtures/code-review-verdict.v1.json
          cmp "$RUNNER_TEMP/rs/crates/tool-exchange/tests/fixtures/tool-exchange.v1.json" tests/fixtures/tool-exchange.v1.json
          cmp "$RUNNER_TEMP/rs/crates/mcp-servers/tests/fixtures/mcp-servers.v1.json" tests/fixtures/mcp-servers.v1.json
          cmp "$RUNNER_TEMP/rs/crates/decision/tests/fixtures/decision.v1.json" tests/fixtures/decision.v1.json
          cmp "$RUNNER_TEMP/rs/crates/code-net-guard/tests/fixtures/code-net-guard.v1.json" tests/fixtures/code-net-guard.v1.json
          cmp "$RUNNER_TEMP/rs/crates/role-context/tests/fixtures/role-context.v1.json" tests/fixtures/role-context.v1.json
          cmp "$RUNNER_TEMP/rs/crates/completeness-report/tests/fixtures/completeness-report.v1.json" tests/fixtures/completeness-report.v1.json
          cmp "$RUNNER_TEMP/rs/crates/task-lifecycle/tests/fixtures/task-lifecycle.v1.json" tests/fixtures/task-lifecycle.v1.json
          cmp "$RUNNER_TEMP/rs/crates/code-actions/tests/fixtures/code-actions.v1.json" tests/fixtures/code-actions.v1.json
          cmp "$RUNNER_TEMP/rs/crates/project-file-names/tests/fixtures/project-file-names.v1.json" tests/fixtures/project-file-names.v1.json
          cmp "$RUNNER_TEMP/rs/crates/provider-egress/tests/fixtures/provider-egress.v1.json" tests/fixtures/provider-egress.v1.json
          cmp "$RUNNER_TEMP/rs/crates/browser-policy/tests/fixtures/browser-policy.v1.json" tests/fixtures/browser-policy.v1.json
          cmp "$RUNNER_TEMP/rs/crates/tool-gate/tests/fixtures/tool-gate.v1.json" tests/fixtures/tool-gate.v1.json
          cmp "$RUNNER_TEMP/rs/crates/toolboxes-permitted/tests/fixtures/toolboxes-permitted.v1.json" tests/fixtures/toolboxes-permitted.v1.json
          cmp "$RUNNER_TEMP/rs/crates/llamacpp-presets/tests/fixtures/llamacpp-presets.v1.json" tests/fixtures/llamacpp-presets.v1.json
          cmp "$RUNNER_TEMP/rs/crates/project-edit-target/tests/fixtures/project-edit-target.v1.json" tests/fixtures/project-edit-target.v1.json
          cmp "$RUNNER_TEMP/rs/crates/llamacpp-autoconfig/tests/fixtures/llamacpp-autoconfig.v1.json" tests/fixtures/llamacpp-autoconfig.v1.json
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          "$RUNNER_TEMP/rs/tools/build-dav-parse-wasm.sh" "$PWD/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  server/wasm/dav-parse.wasm" | sha256sum -c -
      - run: npm run test:server
        env:
          DAV_PARSE_WASM_REQUIRED: '1'
      # The verifier's privilege separation (#703) needs root to drop to its git and test uids.
      - run: sudo "$(command -v node)" --test server/code-verify-root.test.cjs
      # The release build sets STAMP_VERSION (#317); re-run the stamp test with a SHA-shaped value.
      - run: STAMP_VERSION=ci1234567 node --test tests/server/build-version-stamp.test.cjs
      # Dev tooling (moved from noevia at the cutover, #952): no install step, but it imports
      # server/tool-result-reduce.cjs, so it must not drift. Needs ripgrep.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: node --test tools/repo-index/*.test.cjs

  code-sandbox:
    name: Code sandbox bridge tests
    runs-on: ubuntu-latest
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/, the OCR test reading server/pdf-reduce.cjs) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          path: sib/noevia-services
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-core
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # #999: sandbox-bridge.wasm at the noevia-rs ref pinned in code-sandbox/sandbox-bridge.lock,
      # checksum-verified (tarball and module), so SANDBOX_BRIDGE_IMPL=rust runs for real against
      # the built artifact. The shared fixture table must be byte-identical to noevia-rs's copy.
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91 # 1.99.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build sandbox-bridge.wasm at the pinned noevia-rs ref
        working-directory: self
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|SANDBOX_BRIDGE_WASM_SHA256)=[0-9a-f]+$' code-sandbox/sandbox-bridge.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sandbox-bridge.lock NOEVIA_RS_REF is not a 40-char SHA"; exit 1; }
          # The pin must be on noevia-rs main, so core main never holds a ref from an unmerged or
          # force-pushed-away PR head.
          status=""
          for attempt in 1 2 3 4 5; do
            status=$(gh api "repos/sbstndalton/noevia-rs/compare/$NOEVIA_RS_REF...main" --jq .status 2>/dev/null) && break
            sleep $((attempt * 5))
          done
          echo "sandbox-bridge NOEVIA_RS_REF $NOEVIA_RS_REF: noevia-rs main is '$status'"
          case "$status" in identical|ahead) ;; *) echo "::error::sandbox-bridge.lock NOEVIA_RS_REF is not reachable from sbstndalton/noevia-rs main ('$status')"; exit 1 ;; esac
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rs" && tar -xzf "$RUNNER_TEMP/rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/rs"
          cmp "$RUNNER_TEMP/rs/crates/sandbox-bridge/tests/fixtures/sandbox-bridge.v1.json" tests/fixtures/sandbox-bridge.v1.json
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          out="$GITHUB_WORKSPACE/ws/services/code-sandbox/wasm/sandbox-bridge.wasm"
          "$RUNNER_TEMP/rs/tools/build-sandbox-bridge-wasm.sh" "$out"
          echo "$SANDBOX_BRIDGE_WASM_SHA256  $out" | sha256sum -c -
      - name: The fixture table is what the generator makes from the JS references
        working-directory: self
        run: node tools/gen-sandbox-bridge-fixtures.cjs | cmp - tests/fixtures/sandbox-bridge.v1.json
      - run: node --test ws/services/code-sandbox/pi-acp-bridge.test.cjs ws/services/code-sandbox/sandbox-bridge-wasm.test.cjs
        env:
          SANDBOX_BRIDGE_WASM_REQUIRED: '1'
      # The image a release ships: its own build stage rebuilds and checks the module, and the
      # runtime image must load it (sha256 against the lock, no imports, the ABI) and run the
      # framing and toolCallFor through it.
      # The buildx driver image (moby/buildkit) is itself a Docker Hub pull: mirror the daemon too.
      - name: Docker Hub pull-through mirror (daemon)
        run: self/.github/scripts/docker-hub-mirror.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (v3.12.0)
        with:
          # Docker Hub pull-through mirror, docker.io fallback (noevia #1221).
          buildkitd-config: self/.github/buildkitd-mirror.toml
          # The driver image itself is a Docker Hub pull; take it from the mirror (same tag).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: self/code-sandbox
          file: self/code-sandbox/Dockerfile
          build-args: |
            HARNESS_PACKAGE=@earendil-works/pi-coding-agent
            HARNESS_VERSION=0.87.0
          push: false
          load: true
          tags: noevia-code-sandbox:ci
          cache-from: type=gha,scope=code-sandbox
          cache-to: type=gha,mode=max,scope=code-sandbox
      - name: The shipped image loads sandbox-bridge.wasm
        run: |
          set -euo pipefail
          docker run --rm --read-only noevia-code-sandbox:ci node -e '
            const sb = require("/srv/sandbox-bridge-wasm.cjs");
            sb.ensure();
            const seen = [];
            sb.linesRust((m) => seen.push(m), () => {}, undefined, (e) => { throw e; })("{\"a\":1}\r\nnope\n");
            const call = sb.toolCallForRust({ toolCallId: "c1", toolName: "bash", input: { command: "ls" } });
            if (JSON.stringify(seen) !== "[{\"a\":1}]" || call.kind !== "execute" || call.title !== "ls") process.exit(1);
            console.log("sandbox-bridge.wasm OK in the shipped image");'

  web-image:
    name: Web image build
    runs-on: ubuntu-latest
    steps:
      # A noevia-shaped workspace: noevia main (integration files: deploy/, docs/, tools/,
      # release/versions.lock), the sibling split repos at main, then this checkout on top, each at
      # its monorepo path (the inverse of tools/repo-split's map). Tests that cross repo lines
      # (server tests reading src/, the OCR test reading server/pdf-reduce.cjs) run unchanged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: self
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia
          path: ws
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-web
          path: sib/noevia-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sbstndalton/noevia-services
          path: sib/noevia-services
      - name: Lay out the noevia-shaped workspace
        # The job default (ws/apps/web or ws/services/...) only exists after this step: since the
        # cutover noevia main has no apps/web or services/ (noevia #952).
        working-directory: .
        env:
          SELF: noevia-core
        run: |
          set -euo pipefail
          place() { rm -rf "ws/$3"; mkdir -p "$(dirname "ws/$3")"; cp -R "$1/$2" "ws/$3"; }
          overlay() {
            local repo="$1" d e t
            if [ "$repo" = "$SELF" ]; then d=self; else d="sib/$repo"; fi
            for e in $(git -C "$d" ls-tree --name-only HEAD); do
              case "$repo:$e" in
                *:.github|*:README.md) ;;
                noevia-services:*) place "$d" "$e" "services/$e" ;;
                noevia-core:code-sandbox) place "$d" "$e" services/code-sandbox ;;
                *:tests) for t in $(git -C "$d" ls-tree --name-only HEAD:tests); do place "$d" "tests/$t" "apps/web/tests/$t"; done ;;
                *) place "$d" "$e" "apps/web/$e" ;;
              esac
            done
          }
          for r in noevia-services noevia-core noevia-web; do [ "$r" = "$SELF" ] || overlay "$r"; done
          overlay "$SELF"
          echo "noevia $(git -C ws rev-parse HEAD), $SELF $(git -C self rev-parse HEAD)"
      # Since the repo split cutover (noevia #952) the web image is built the way a release builds
      # it: noevia's build/web.Dockerfile over an assembled tree (web/ = noevia-web, core/ =
      # noevia-core, release-refs), as deploy/tools/assemble-release.sh lays it out. The image
      # build runs the client and server tests too.
      - name: Lay out an assembled release tree
        env:
          WEB: sib/noevia-web
          CORE: self
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/tree"; mkdir -p "$t/web" "$t/core"
          git -C "$WEB" archive HEAD | tar -x -C "$t/web"
          git -C "$CORE" archive HEAD | tar -x -C "$t/core"
          printf 'NOEVIA_SHA=%s\nNOEVIA_WEB_SHA=%s\nNOEVIA_CORE_SHA=%s\nNOEVIA_SERVICES_SHA=%s\n' "$(git -C ws rev-parse HEAD)" \
            "$(git -C "$WEB" rev-parse HEAD)" "$(git -C "$CORE" rev-parse HEAD)" ci > "$t/release-refs"
          echo "TREE=$t" >> "$GITHUB_ENV"
      # The buildx driver image (moby/buildkit) is itself a Docker Hub pull: mirror the daemon too.
      - name: Docker Hub pull-through mirror (daemon)
        run: self/.github/scripts/docker-hub-mirror.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (v3.12.0)
        with:
          # Docker Hub pull-through mirror, docker.io fallback (noevia #1221).
          buildkitd-config: self/.github/buildkitd-mirror.toml
          # The driver image itself is a Docker Hub pull; take it from the mirror (same tag).
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6 (v6.19.2)
        with:
          context: ${{ env.TREE }}
          file: ws/build/web.Dockerfile
          push: false
          # load: the next step runs tests inside the built (runtime-stage) image.
          load: true
          tags: noevia-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # noevia #990: the differential tests compare Node's own decoders (TextDecoder windows-1252,
      # base64url) with the Rust module. The image build runs the tests on the alpine build stage;
      # this runs the upload-sniff, secret-envelope, mcp-frame, s3-sign, stream-guard, gguf-meta, policy-leaves, code-review-verdict, tool-exchange, mcp-servers, decision, code-net-guard, role-context, completeness-report, task-lifecycle, llamacpp-autoconfig, code-actions, project-file-names, provider-egress, browser-policy, tool-gate, toolboxes-permitted, llamacpp-presets and project-edit-target (JSON.parse, String#trim and Number() white space, non-Unicode RegExp \s/\b//i, String#normalize NFKD, toLowerCase/toUpperCase,, String#trim, URL, /\s/, Number#toString, utf8 decoding,
      # Object.prototype) ones on the exact runtime image that ships
      # (node:22-bookworm, whatever Node 22.x it resolves to), not on the runner's Node.
      - name: Differential tests on the shipped runtime image
        run: |
          set -euo pipefail
          docker run --rm -e DAV_PARSE_WASM_REQUIRED=1 \
            -v "$TREE/core/tests:/app/tests:ro" -w /app noevia-web:ci sh -c \
            'node --version && node --test tests/server/upload-sniff-differential.test.cjs tests/server/secret-envelope-differential.test.cjs tests/server/mcp-frame-differential.test.cjs tests/server/chat-template-caps-differential.test.cjs tests/server/autotune-plan-differential.test.cjs tests/server/load-verdict-differential.test.cjs tests/server/tune-contention-differential.test.cjs tests/server/long-profile-differential.test.cjs tests/server/s3-sign-differential.test.cjs tests/server/stream-guard-differential.test.cjs tests/server/gguf-meta-differential.test.cjs tests/server/policy-leaves-differential.test.cjs tests/server/code-review-verdict-differential.test.cjs tests/server/tool-exchange-differential.test.cjs tests/server/mcp-servers-differential.test.cjs tests/server/decision-differential.test.cjs tests/server/code-net-guard-differential.test.cjs tests/server/role-context-differential.test.cjs tests/server/completeness-report-differential.test.cjs tests/server/task-lifecycle-differential.test.cjs tests/server/code-actions-differential.test.cjs tests/server/project-file-names-differential.test.cjs tests/server/provider-egress-differential.test.cjs tests/server/browser-policy-differential.test.cjs tests/server/tool-gate-differential.test.cjs tests/server/toolboxes-permitted-differential.test.cjs tests/server/llamacpp-presets-differential.test.cjs tests/server/project-edit-target-differential.test.cjs tests/server/llamacpp-autoconfig-differential.test.cjs'
