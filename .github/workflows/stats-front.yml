name: Native engine statistics front contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  stats-front:
    name: Required native engine statistics front contracts (#1650)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CORE_ACCEPTANCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: core
      # The native GET /api/stats source: the noevia-rs#109 merge commit on rs main (carries #98 and the core#120 corpus, #1792). Downloaded twice;
      # byte-identical archive hash.
      - name: Fetch verified native engine statistics source
        run: |
          set -euo pipefail
          curl -fsSL https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/2fe1a15b4112e2c0a581745701a4c533cd3e414e -o "$RUNNER_TEMP/stats-rs.tgz"
          echo "246c1a87cfc0390f09199087431e1be90a029b77e339744b311f57638a910289  $RUNNER_TEMP/stats-rs.tgz" | sha256sum -c -
          mkdir rs
          tar -xzf "$RUNNER_TEMP/stats-rs.tgz" --strip-components=1 -C rs
      # Merged rs #94 acceptance tooling (#1308/#1320), at the noevia-rs#109 merge commit: the core-acceptance adapter verifies this
      # exact archive and reads its launch templates; not a runtime release pin.
      - name: Fetch verified merged acceptance tooling
        run: |
          set -euo pipefail
          curl -fsSL https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/2fe1a15b4112e2c0a581745701a4c533cd3e414e -o "$RUNNER_TEMP/accept-rs.tgz"
          echo "246c1a87cfc0390f09199087431e1be90a029b77e339744b311f57638a910289  $RUNNER_TEMP/accept-rs.tgz" | sha256sum -c -
          mkdir rs-accept
          tar -xzf "$RUNNER_TEMP/accept-rs.tgz" --strip-components=1 -C rs-accept
          echo "CORE_ACCEPTANCE_RS=$GITHUB_WORKSPACE/rs-accept" >> "$GITHUB_ENV"
          echo "CORE_ACCEPTANCE_ARCHIVE=$RUNNER_TEMP/accept-rs.tgz" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - uses: dtolnay/rust-toolchain@70dec6087f2cb6bab9fbac4da23160afbe848e91
      - run: npm ci --no-fund --no-audit
        working-directory: core/server
      - name: Build the independently pinned required server WASM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          eval "$(grep -E '^(NOEVIA_RS_REF|NOEVIA_RS_SHA256|DAV_PARSE_WASM_SHA256)=[0-9a-f]+$' core/server/dav-parse.lock)"
          [[ "$NOEVIA_RS_REF" =~ ^[0-9a-f]{40}$ ]]
          status=$(gh api "repos/sbstndalton/noevia-rs/compare/$NOEVIA_RS_REF...main" --jq .status)
          case "$status" in identical|ahead) ;; *) echo "Required WASM pin is not on main"; exit 1 ;; esac
          curl -fsSL "https://codeload.github.com/sbstndalton/noevia-rs/tar.gz/$NOEVIA_RS_REF" -o "$RUNNER_TEMP/wasm-rs.tgz"
          echo "$NOEVIA_RS_SHA256  $RUNNER_TEMP/wasm-rs.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/wasm-rs"
          tar -xzf "$RUNNER_TEMP/wasm-rs.tgz" --strip-components=1 -C "$RUNNER_TEMP/wasm-rs"
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          "$RUNNER_TEMP/wasm-rs/tools/build-dav-parse-wasm.sh" "$GITHUB_WORKSPACE/core/server/wasm/dav-parse.wasm"
          echo "$DAV_PARSE_WASM_SHA256  core/server/wasm/dav-parse.wasm" | sha256sum -c -
      - name: Native and Node engine statistics contracts
        working-directory: rs
        run: |
          set -euo pipefail
          node --test ../core/server/routes/models.test.cjs ../core/server/contract-corpus-stats-env.test.cjs
          # The candidate core's own handler gives every committed case's exact answer: only the
          # core SHA and source hashes may differ from the fixture recorded at contracts/http/core.ref.
          node crates/server-stats/tests/oracle.cjs ../core "$RUNNER_TEMP/node-stats.json"
          node -e '
            const a = require(process.argv[1]), b = require(process.argv[2]);
            if (a.core !== process.env.CORE_ACCEPTANCE_HEAD) throw Error("oracle did not run on the candidate head");
            if (JSON.stringify(a.cases) !== JSON.stringify(b.cases)) throw Error("candidate core answers differ from the committed native corpus");
            if (a.cases.length < 300) throw Error("corpus shrank");
            console.log("candidate core matches", a.cases.length, "native stats cases");
          ' "$RUNNER_TEMP/node-stats.json" "$PWD/crates/server-stats/tests/fixtures/node-stats.v1.json"
          cargo test --locked -p server-stats
          cargo test --locked -p noevia-server --features rust-stats --test stats
          cargo test --locked -p noevia-server --features rust-stats --lib stats
          cargo build --locked -p replay -p noevia-server --features noevia-server/rust-stats
          target/debug/noevia-server --features | grep -qx rust-stats
      - name: Candidate-core acceptance seam (as usage-front)
        run: |
          set -euo pipefail
          # corpus-launcher only serves the exact core.ref the corpus records; the merged
          # core-acceptance adapter serves this candidate HEAD when it descends from it.
          cargo build --locked --manifest-path core/tools/qualification/reasoning-acceptance/Cargo.toml
          mkdir "$RUNNER_TEMP/acceptance-bin"
          ln -s "$GITHUB_WORKSPACE/rs/target/debug/noevia-server" "$RUNNER_TEMP/acceptance-bin/noevia-server"
          ln -s "$GITHUB_WORKSPACE/core/tools/qualification/reasoning-acceptance/target/debug/core-acceptance" "$RUNNER_TEMP/acceptance-bin/core-acceptance"
          printf '%s\n' '#!/bin/sh' '# Explicit candidate-core acceptance seam; original RS launcher is untouched.' 'exec "$(dirname "$0")/core-acceptance" "$@"' > "$RUNNER_TEMP/acceptance-bin/corpus-launcher"
          chmod +x "$RUNNER_TEMP/acceptance-bin/corpus-launcher"
          echo "CORE_ACCEPTANCE_SHIM=$RUNNER_TEMP/acceptance-bin/corpus-launcher" >> "$GITHUB_ENV"
      - name: Full HTTP replay through native auth and engine statistics
        working-directory: rs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seed"
          target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/stats-positive" \
            --server-cmd "exec env NOEVIA_RUST_AUTH=1 NOEVIA_RUST_STATS=1 sh '$GITHUB_WORKSPACE/rs/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$RUNNER_TEMP/acceptance-bin/noevia-server'" \
            --report "$RUNNER_TEMP/stats-positive.json"
      - name: Stats omission refuses fallback while native auth still works
        working-directory: rs
        run: |
          set -uo pipefail
          if target/debug/replay run --corpus contracts/http/corpus --base http://127.0.0.1:18021 \
            --ignore-body hours --ignore-body peakHour/hour \
            --seed "$RUNNER_TEMP/seed" --work "$RUNNER_TEMP/stats-control" \
            --server-cmd "exec env NOEVIA_RUST_AUTH=1 NOEVIA_RUST_STATS=1 REPLAY_FRONT_CONTROL_NODE_ONLY_STATS=1 sh '$GITHUB_WORKSPACE/rs/tools/front/replay-front.sh' '$GITHUB_WORKSPACE/core' '$RUNNER_TEMP/acceptance-bin/noevia-server'" \
            --report "$RUNNER_TEMP/stats-control.json"; then
            echo "::error::missing native engine statistics replayed successfully"; exit 1
          fi
          python3 - "$RUNNER_TEMP/stats-control.json" <<'PYCONTROL'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          stats=[r for r in rows if r['method']=='GET' and r['path']=='/api/stats' and r['expectedStatus']==200]
          setup=[r for r in rows if r['path']=='/api/setup/complete' and r['expectedStatus']==201]
          other=[r for r in rows if r not in stats and (r['diffs'] or r['error'] or r['status']!=r['expectedStatus'])]
          assert stats and all(r['status']==503 for r in stats), stats
          assert setup and all(r['status']==201 for r in setup), setup
          assert not other, [(r['method'], r['path']) for r in other]
          print('specific stats 503 controls:',len(stats),'native setup successes:',len(setup))
          PYCONTROL
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-stats-front-evidence
          path: |
            ${{ runner.temp }}/stats-positive.json
            ${{ runner.temp }}/stats-control.json
            ${{ runner.temp }}/node-stats.json
          if-no-files-found: error
