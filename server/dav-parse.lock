# dav-parse.wasm (#967): the Rust/WebAssembly port of dav-listing.cjs's PROPFIND listing parser,
# since #976/#978 also of s3-listing.cjs's page scan and storage-path.cjs's rules, and since #977
# of upload-sniff.cjs's validate, classify and decodeText (one module).
